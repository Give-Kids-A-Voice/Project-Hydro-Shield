name: Build water tiles and publish site
# Data refresh schedule: each source is refreshed ONCE A MONTH, on its own day, so no single run
# hits many public servers at once. The workflow runs daily; a day with no slot does nothing.
#   Day 1  Florida water (OpenStreetMap)        Day 11 Volusia        Day 21 California parcel pools
#   Day 2  Southern California water + OSM pools Day 12 Seminole              (San Diego County + Palm Desert)
#   Day 3  Hillsborough                          Day 13 Osceola
#   Day 4  Manatee                               Day 14 Lake
#   Day 5  Orange (FL)                           Day 15 Marion
#   Day 6  Lee                                   Day 16 Charlotte
#   Day 7  Polk                                  Day 17 St. Johns
#   Day 8  Hernando                              Day 18 Alachua
#   Day 9  Sarasota                              Day 19 Martin
#   Day 10 Duval                                 Day 20 Leon
#   Day 22 Arizona water + OSM pools (Maricopa)  Day 26 Harris (TX) pools
#   Day 23 Nevada water + OSM pools (Clark)      Day 27 Tarrant + Collin (TX) pools
#   Day 24 Texas water + OSM pools (Harris,      Day 28 Dallas (TX) pools
#          Tarrant, Dallas, Collin)
#   Day 25 Maricopa + Clark pools
# Pasco, Pinellas, Citrus and St. Lucie are refreshed by hand from files the county sends or the owner downloads.
# Refreshed pool tiles are committed back to docs/data/pools, so pushes never re-download pool data.
# Water tiles live in the Actions cache (one entry per region per month). A push reuses the newest cached
# tiles and only rebuilds a region if no cached copy exists. A failed refresh keeps the previous data.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'   # daily 07:23 UTC; see the slot table above
  workflow_dispatch:
    inputs:
      slot:
        description: 'Refresh one slot now (fl-water, socal-water, hillsborough, manatee, orange, lee, polk, hernando, sarasota, duval, volusia, seminole, osceola, lake, marion, charlotte, stjohns, alachua, martin, leon, ca-parcels, az-water, nv-water, tx-water, az-nv-pools, harris, tarrant-collin, dallas) or leave blank to just publish'
        required: false
        default: ''
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Pick today's slot
        id: s
        run: |
          slot=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "$(date -u +%-d)" in
              1) slot=fl-water;; 2) slot=socal-water;; 3) slot=hillsborough;; 4) slot=manatee;; 5) slot=orange;;
              6) slot=lee;; 7) slot=polk;; 8) slot=hernando;; 9) slot=sarasota;; 10) slot=duval;;
              11) slot=volusia;; 12) slot=seminole;; 13) slot=osceola;; 14) slot=lake;; 15) slot=marion;;
              16) slot=charlotte;; 17) slot=stjohns;; 18) slot=alachua;; 19) slot=martin;; 20) slot=leon;;
              21) slot=ca-parcels;; 22) slot=az-water;; 23) slot=nv-water;; 24) slot=tx-water;;
              25) slot=az-nv-pools;; 26) slot=harris;; 27) slot=tarrant-collin;; 28) slot=dallas;;
            esac
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            slot="${{ github.event.inputs.slot }}"
          fi
          run=true
          [ "${{ github.event_name }}" = "schedule" ] && [ -z "$slot" ] && run=false
          echo "slot=$slot" >> "$GITHUB_OUTPUT"; echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "Slot: ${slot:-none} (run=$run)"
      - name: Restore Florida water tiles
        if: steps.s.outputs.run == 'true'
        id: fl
        uses: actions/cache/restore@v4
        with:
          path: fl-water
          key: fl-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py') }}
          restore-keys: |
            fl-water-
      - name: Restore Southern California water tiles
        if: steps.s.outputs.run == 'true'
        id: sc
        uses: actions/cache/restore@v4
        with:
          path: |
            socal-water
            socal-pools
          key: socal-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py', 'scripts/build_osm_region.py') }}
          restore-keys: |
            socal-water-
      - name: Restore Arizona water tiles
        if: steps.s.outputs.run == 'true'
        id: az
        uses: actions/cache/restore@v4
        with:
          path: |
            az-water
            az-pools
          key: az-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py', 'scripts/build_osm_region.py') }}
          restore-keys: |
            az-water-
      - name: Restore Nevada water tiles
        if: steps.s.outputs.run == 'true'
        id: nv
        uses: actions/cache/restore@v4
        with:
          path: |
            nv-water
            nv-pools
          key: nv-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py', 'scripts/build_osm_region.py') }}
          restore-keys: |
            nv-water-
      - name: Restore Texas water tiles
        if: steps.s.outputs.run == 'true'
        id: tx
        uses: actions/cache/restore@v4
        with:
          path: |
            tx-water
            tx-pools
          key: tx-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py', 'scripts/build_osm_region.py') }}
          restore-keys: |
            tx-water-
      - name: Build Florida water tiles
        id: flb
        if: steps.s.outputs.run == 'true' && (steps.s.outputs.slot == 'fl-water' || steps.fl.outputs.cache-matched-key == '')
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -q shapely
          curl -sSfL -o florida.osm.pbf https://download.geofabrik.de/north-america/us/florida-latest.osm.pbf
          osmium tags-filter florida.osm.pbf \
            nwr/natural=water nwr/landuse=basin,reservoir \
            w/leisure=swimming_pool,water_park \
            w/waterway=canal,ditch,drain,stream,river,riverbank \
            nw/amenity=fountain -o water.osm.pbf
          osmium export water.osm.pbf -f geojsonseq --add-unique-id=type_id -o water.geojsonseq
          rm -rf fl-water.new && python3 scripts/build_water_tiles.py water.geojsonseq fl-water.new
          rm -rf fl-water && mv fl-water.new fl-water && du -sh fl-water
      - name: Save Florida water tiles
        if: steps.flb.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: fl-water
          key: fl-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py') }}-${{ github.run_id }}
      - name: Build Southern California water tiles and OSM pool points
        id: scb
        if: steps.s.outputs.run == 'true' && (steps.s.outputs.slot == 'socal-water' || steps.sc.outputs.cache-matched-key == '')
        continue-on-error: true   # never block the deploy; the previous tiles stay
        run: |
          # LA, Orange, Ventura, Riverside, San Bernardino, San Diego. Same water tags and tile scheme as Florida; pools become points.
          pip install -q osmium shapely
          curl -sSfL -o socal.osm.pbf https://download.geofabrik.de/north-america/us/california/socal-latest.osm.pbf
          python3 scripts/build_osm_region.py filter socal.osm.pbf socal-water.osm.pbf
          rm -f socal.osm.pbf
          rm -rf socal-water.new socal-pools.new
          python3 scripts/build_osm_region.py export socal-water.osm.pbf socal-water.geojsonseq socal-pools.new
          python3 scripts/build_water_tiles.py socal-water.geojsonseq socal-water.new
          rm -rf socal-water socal-pools && mv socal-water.new socal-water && mv socal-pools.new socal-pools
          du -sh socal-water socal-pools
      - name: Save Southern California water tiles
        if: steps.scb.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            socal-water
            socal-pools
          key: socal-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py', 'scripts/build_osm_region.py') }}-${{ github.run_id }}
      - name: Build Arizona water tiles and OSM pool points
        id: azb
        if: steps.s.outputs.run == 'true' && (steps.s.outputs.slot == 'az-water' || steps.az.outputs.cache-matched-key == '')
        continue-on-error: true   # never block the deploy; the previous tiles stay
        timeout-minutes: 40
        run: |
          # Geofabrik state extract, filtered to water/pools and clipped to the region's counties (scripts/build_osm_region.py REGIONS)
          pip install -q osmium shapely
          curl -sSfL -o az.osm.pbf https://download.geofabrik.de/north-america/us/arizona-latest.osm.pbf
          python3 scripts/build_osm_region.py filter az.osm.pbf az-water.osm.pbf arizona
          rm -f az.osm.pbf
          rm -rf az-water.new az-pools.new
          python3 scripts/build_osm_region.py export az-water.osm.pbf az-water.geojsonseq az-pools.new arizona
          python3 scripts/build_water_tiles.py az-water.geojsonseq az-water.new
          rm -f az-water.osm.pbf az-water.geojsonseq
          rm -rf az-water az-pools && mv az-water.new az-water && mv az-pools.new az-pools
          du -sh az-water az-pools
      - name: Save Arizona water tiles
        if: steps.azb.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            az-water
            az-pools
          key: az-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py', 'scripts/build_osm_region.py') }}-${{ github.run_id }}
      - name: Build Nevada water tiles and OSM pool points
        id: nvb
        if: steps.s.outputs.run == 'true' && (steps.s.outputs.slot == 'nv-water' || steps.nv.outputs.cache-matched-key == '')
        continue-on-error: true   # never block the deploy; the previous tiles stay
        timeout-minutes: 40
        run: |
          # Geofabrik state extract, filtered to water/pools and clipped to the region's counties (scripts/build_osm_region.py REGIONS)
          pip install -q osmium shapely
          curl -sSfL -o nv.osm.pbf https://download.geofabrik.de/north-america/us/nevada-latest.osm.pbf
          python3 scripts/build_osm_region.py filter nv.osm.pbf nv-water.osm.pbf nevada
          rm -f nv.osm.pbf
          rm -rf nv-water.new nv-pools.new
          python3 scripts/build_osm_region.py export nv-water.osm.pbf nv-water.geojsonseq nv-pools.new nevada
          python3 scripts/build_water_tiles.py nv-water.geojsonseq nv-water.new
          rm -f nv-water.osm.pbf nv-water.geojsonseq
          rm -rf nv-water nv-pools && mv nv-water.new nv-water && mv nv-pools.new nv-pools
          du -sh nv-water nv-pools
      - name: Save Nevada water tiles
        if: steps.nvb.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            nv-water
            nv-pools
          key: nv-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py', 'scripts/build_osm_region.py') }}-${{ github.run_id }}
      - name: Build Texas water tiles and OSM pool points
        id: txb
        if: steps.s.outputs.run == 'true' && (steps.s.outputs.slot == 'tx-water' || steps.tx.outputs.cache-matched-key == '')
        continue-on-error: true   # never block the deploy; the previous tiles stay
        timeout-minutes: 40
        run: |
          # Geofabrik state extract, filtered to water/pools and clipped to the region's counties (scripts/build_osm_region.py REGIONS)
          pip install -q osmium shapely
          curl -sSfL -o tx.osm.pbf https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf
          python3 scripts/build_osm_region.py filter tx.osm.pbf tx-water.osm.pbf texas
          rm -f tx.osm.pbf
          rm -rf tx-water.new tx-pools.new
          python3 scripts/build_osm_region.py export tx-water.osm.pbf tx-water.geojsonseq tx-pools.new texas
          python3 scripts/build_water_tiles.py tx-water.geojsonseq tx-water.new
          rm -f tx-water.osm.pbf tx-water.geojsonseq
          rm -rf tx-water tx-pools && mv tx-water.new tx-water && mv tx-pools.new tx-pools
          du -sh tx-water tx-pools
      - name: Save Texas water tiles
        if: steps.txb.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            tx-water
            tx-pools
          key: tx-water-${{ steps.s.outputs.month }}-${{ hashFiles('scripts/build_water_tiles.py', 'scripts/build_osm_region.py') }}-${{ github.run_id }}
      - name: Refresh today's pool source
        id: ref
        if: steps.s.outputs.run == 'true' && steps.s.outputs.slot != '' && steps.s.outputs.slot != 'fl-water'
        continue-on-error: true   # a failed refresh keeps the committed tiles
        run: |
          P=docs/data/pools; slot="${{ steps.s.outputs.slot }}"
          case "$slot" in
            socal-water)
              # Fresh OSM pool points for Southern California, then re-apply the parcel records so they win over OSM duplicates
              [ -d socal-pools ] && python3 scripts/build_osm_region.py merge socal-pools $P && python3 scripts/build_ca_parcel_pools.py $P ;;
            az-water|nv-water|tx-water)
              # Fresh OSM pool points merged into the committed tiles; county records win over nearby OSM duplicates
              d="${slot%-water}-pools"; [ -d "$d" ] && python3 scripts/build_osm_region.py merge "$d" $P ;;
            az-nv-pools) python3 scripts/build_metro_pools.py $P raw maricopa clark ;;
            harris)
              pip install -q pyogrio pyproj shapely
              mkdir -p raw/harris && ( cd raw/harris \
                && { y=$(date -u +%Y); curl -sSfL --retry 3 -o rbl.zip https://download.hcad.org/data/CAMA/$y/Real_building_land.zip \
                     || curl -sSfL --retry 3 -o rbl.zip https://download.hcad.org/data/CAMA/$((y - 1))/Real_building_land.zip; } \
                && curl -sSfL --retry 3 -o parcels.zip https://download.hcad.org/data/GIS/Parcels.zip && unzip -oq parcels.zip && rm parcels.zip ) \
                && python3 scripts/build_metro_pools.py $P raw harris ;;
            tarrant-collin)
              mkdir -p raw/tarrant && curl -sSfL -A "Mozilla/5.0" -o raw/tarrant/prop.zip "https://www.tad.org/content/data-download/PropertyData(Delimited)_R.ZIP" \
                && python3 scripts/build_metro_pools.py $P raw tarrant collin ;;
            dallas)
              pip install -q pyogrio pyproj shapely
              scripts/fetch_dallas_raw.sh raw/dallas && python3 scripts/build_metro_pools.py $P raw dallas ;;
            hillsborough) python3 scripts/build_hillsborough_pools.py $P ;;
            manatee|orange|lee) python3 scripts/build_arcgis_pools.py $P "$slot" ;;
            polk)
              pip install -q pyshp pyproj
              mkdir -p raw/polk && ( cd raw/polk \
                && curl -sfL -o misc.zip "https://www.polkflpa.gov/FTPPage/downloader.ashx?filename=ftp_misc.zip&dir=%5CAppraisalData%5C" \
                && curl -sfL -o parcel.zip "https://www.polkflpa.gov/FTPPage/downloader.ashx?filename=parcel.zip&dir=%5CGISData%5C" \
                && unzip -oq misc.zip && unzip -oq parcel.zip ) && python3 scripts/build_shapefile_pools.py polk raw/polk $P ;;
            hernando)
              pip install -q pyshp pyproj
              mkdir -p raw/hernando && ( cd raw/hernando && curl -sfL -O https://hernandocountypa-florida.us/download/FEAT.ZIP && unzip -oq FEAT.ZIP ) \
                && python3 scripts/build_shapefile_pools.py hernando raw/hernando $P ;;
            sarasota)
              mkdir -p raw/sarasota && ( cd raw/sarasota && curl -sfL -O https://www.sarasotapropertyappraiser.gov/downloads/SCPA_Detailed_Data.zip && unzip -oq SCPA_Detailed_Data.zip SFYI.txt ) \
                && python3 scripts/build_statewide_join.py sarasota raw/sarasota $P ;;
            duval)
              mkdir -p raw/duval && ( cd raw/duval \
                && u=$(curl -s -A "Mozilla/5.0" https://www.jacksonville.gov/departments/property-appraiser/data-offerings | grep -oE 'getContentAsset/[^"]+REAL-ESTATE-PIPE-DELIMITED-TEXT-CERTIFIED[^"]+' | head -1 | sed 's/&amp;/\&/g') \
                && curl -sfL -A "Mozilla/5.0" -o re.zip "https://www.jacksonville.gov/$u" && unzip -oq re.zip ) \
                && python3 scripts/build_statewide_join.py duval raw/duval $P ;;
            volusia|seminole|osceola|lake|marion|charlotte|stjohns|alachua|martin|leon)
              [ "$slot" = stjohns ] && sudo apt-get install -y -qq mdbtools
              scripts/fetch_county_raw.sh "$slot" "raw/$slot" >/dev/null && python3 scripts/build_statewide_join.py "$slot" "raw/$slot" $P ;;
            ca-parcels) python3 scripts/build_ca_parcel_pools.py $P ;;
            *) echo "Unknown slot $slot"; exit 1 ;;
          esac
          rm -rf raw
      - name: Save refreshed pool tiles to the repository
        if: steps.ref.outcome == 'success'
        run: |
          git config user.name "Hydro-Shield data refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pools
          if git diff --cached --quiet; then echo "No pool changes"; exit 0; fi
          git commit -q -m "Monthly data refresh: ${{ steps.s.outputs.slot }} pool records"
          git pull -q --rebase origin main && git push -q origin HEAD:main || echo "Could not save refreshed tiles; this run still publishes them"
      - name: Assemble site
        if: steps.s.outputs.run == 'true'
        run: |
          mkdir -p _site && cp -r docs/. _site/
          rm -rf _site/data/water && mkdir -p _site/data/water
          [ -d fl-water ] && cp -r fl-water/. _site/data/water/
          # Regions can share a border tile (California / Nevada), so these are merged rather than copied over each other
          dirs=""; for r in socal az nv tx; do [ -d $r-water ] && dirs="$dirs $r-water" || echo "No $r water tiles this run"; done
          [ -n "$dirs" ] && python3 scripts/merge_tiles.py _site/data/water $dirs
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.s.outputs.run == 'true'
        with:
          path: _site
    outputs:
      run: ${{ steps.s.outputs.run }}
  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
