name: Build water tiles and publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'   # Mondays 07:17 UTC: refresh Florida water from OpenStreetMap
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Week key
        id: wk
        run: echo "key=water-$(date -u +%G-%V)-${{ hashFiles('scripts/build_water_tiles.py') }}" >> "$GITHUB_OUTPUT"
      - name: Reuse this week's tiles
        id: cache
        uses: actions/cache@v4
        with:
          path: water-tiles
          key: ${{ steps.wk.outputs.key }}
      - name: Build Florida water tiles
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install -q shapely
          curl -sSfL -o florida.osm.pbf https://download.geofabrik.de/north-america/us/florida-latest.osm.pbf
          osmium tags-filter florida.osm.pbf \
            nwr/natural=water nwr/landuse=basin,reservoir \
            w/leisure=swimming_pool,water_park \
            w/waterway=canal,ditch,drain,stream,river,riverbank \
            nw/amenity=fountain -o water.osm.pbf
          osmium export water.osm.pbf -f geojsonseq --add-unique-id=type_id -o water.geojsonseq
          python3 scripts/build_water_tiles.py water.geojsonseq water-tiles
          du -sh water-tiles
      - name: Assemble site
        run: |
          mkdir -p _site && cp -r docs/. _site/
          # Refresh Hillsborough pools from the HCPA parcel service (nightly-updated); keep committed data if it fails
          python3 scripts/build_hillsborough_pools.py _site/data/pools || echo "HCPA refresh skipped"
          python3 scripts/build_arcgis_pools.py _site/data/pools manatee orange lee || echo "ArcGIS county refresh skipped"
          pip install -q pyshp pyproj
          ( mkdir -p raw/polk && cd raw/polk \
            && curl -sfL -o misc.zip "https://www.polkflpa.gov/FTPPage/downloader.ashx?filename=ftp_misc.zip&dir=%5CAppraisalData%5C" \
            && curl -sfL -o parcel.zip "https://www.polkflpa.gov/FTPPage/downloader.ashx?filename=parcel.zip&dir=%5CGISData%5C" \
            && unzip -oq misc.zip && unzip -oq parcel.zip ) && python3 scripts/build_shapefile_pools.py polk raw/polk _site/data/pools || echo "Polk refresh skipped"
          ( mkdir -p raw/hernando && cd raw/hernando && curl -sfL -O https://hernandocountypa-florida.us/download/FEAT.ZIP && unzip -oq FEAT.ZIP ) \
            && python3 scripts/build_shapefile_pools.py hernando raw/hernando _site/data/pools || echo "Hernando refresh skipped"
          ( mkdir -p raw/sarasota && cd raw/sarasota && curl -sfL -O https://www.sarasotapropertyappraiser.gov/downloads/SCPA_Detailed_Data.zip && unzip -oq SCPA_Detailed_Data.zip SFYI.txt ) \
            && python3 scripts/build_statewide_join.py sarasota raw/sarasota _site/data/pools || echo "Sarasota refresh skipped"
          ( mkdir -p raw/duval && cd raw/duval \
            && u=$(curl -s -A "Mozilla/5.0" https://www.jacksonville.gov/departments/property-appraiser/data-offerings | grep -oE 'getContentAsset/[^"]+REAL-ESTATE-PIPE-DELIMITED-TEXT-CERTIFIED[^"]+' | head -1 | sed 's/&amp;/\&/g') \
            && curl -sfL -A "Mozilla/5.0" -o re.zip "https://www.jacksonville.gov/$u" && unzip -oq re.zip ) \
            && python3 scripts/build_statewide_join.py duval raw/duval _site/data/pools || echo "Duval refresh skipped"
          # Further counties from free Property Appraiser files, placed via FDOR parcel centroids (Osceola is the annual certified roll)
          sudo apt-get install -y -qq mdbtools || true
          for c in volusia seminole osceola lake marion charlotte stjohns alachua martin leon; do
            ( scripts/fetch_county_raw.sh "$c" "raw/$c" >/dev/null && python3 scripts/build_statewide_join.py "$c" "raw/$c" _site/data/pools ) || echo "$c refresh skipped"
            rm -rf "raw/$c"
          done
          rm -rf _site/data/water && mkdir -p _site/data && cp -r water-tiles _site/data/water
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
